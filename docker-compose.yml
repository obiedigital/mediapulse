services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediapulse
      POSTGRES_USER: mediapulse
      POSTGRES_PASSWORD: mediapulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediapulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MEDIAPULSE_DATABASE_URL: postgresql+psycopg://mediapulse:mediapulse@postgres:5432/mediapulse
      MEDIAPULSE_SECRET_KEY: ${MEDIAPULSE_SECRET_KEY:-change-me-in-production}
      MEDIAPULSE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MEDIAPULSE_CLASSIFY_MODEL: ${MEDIAPULSE_CLASSIFY_MODEL:-claude-sonnet-4-6}
      MEDIAPULSE_SYNTHESIS_MODEL: ${MEDIAPULSE_SYNTHESIS_MODEL:-claude-opus-4-8}
      MEDIAPULSE_VISION_MODEL: ${MEDIAPULSE_VISION_MODEL:-claude-sonnet-4-6}
      MEDIAPULSE_SMTP_HOST: ${MEDIAPULSE_SMTP_HOST:-}
      MEDIAPULSE_SMTP_PORT: ${MEDIAPULSE_SMTP_PORT:-587}
      MEDIAPULSE_SMTP_USER: ${MEDIAPULSE_SMTP_USER:-}
      MEDIAPULSE_SMTP_PASSWORD: ${MEDIAPULSE_SMTP_PASSWORD:-}
      MEDIAPULSE_SMTP_FROM: ${MEDIAPULSE_SMTP_FROM:-briefs@mediapulse.bw}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - brief_output:/app/brief_output

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  brief_output:
